name: helm

on:
  pull_request:
    paths:
      - deploy/charts/whisper-relay-server/**
      - .github/workflows/helm.yaml
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - deploy/charts/whisper-relay-server/**
      - .github/workflows/helm.yaml
  workflow_dispatch:

permissions:
  contents: read

env:
  CHART_DIR: deploy/charts/whisper-relay-server

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint "$CHART_DIR"

      - name: Render chart
        run: |
          helm template whisper-relay-server "$CHART_DIR"
          helm template whisper-relay-server "$CHART_DIR" \
            --set gateway.enabled=true \
            --set 'gateway.hostnames[0]=whisper.example.com'

      - name: Check release versions
        run: ./scripts/check-versions.sh
