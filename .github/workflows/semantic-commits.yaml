name: semantic-commits

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: read

jobs:
  conventional-commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([A-Za-z0-9._/-]+\))?!?: .+'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "PR title must use Conventional Commits, for example: feat(client): add stream picker"
            echo "Got: $PR_TITLE"
            exit 1
          fi

      - name: Validate commit subjects
        run: |
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([A-Za-z0-9._/-]+\))?!?: .+'
          git fetch --no-tags origin "${{ github.base_ref }}"
          failed=0
          while IFS= read -r subject; do
            if [[ "$subject" == Merge\ * ]]; then
              continue
            fi
            if [[ ! "$subject" =~ $pattern ]]; then
              echo "Invalid commit subject: $subject"
              failed=1
            fi
          done < <(git log --format=%s "origin/${{ github.base_ref }}..HEAD")
          if [[ "$failed" -ne 0 ]]; then
            echo "Commit subjects must use Conventional Commits, for example: fix(server): validate jwt audience"
            exit 1
          fi

