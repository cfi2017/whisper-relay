name: release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: whisper-relay-release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/whisper-relay-server
  CHART_DIR: deploy/charts/whisper-relay-server
  CHART_PACKAGE_DIR: .chart-packages
  OCI_REGISTRY: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  semantic-release:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
      git-tag: ${{ steps.semantic.outputs.new_release_git_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Semantic release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 24
          extra_plugins: |
            @semantic-release/changelog@6
            @semantic-release/exec@7
            @semantic-release/git@10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-server-image:
    runs-on: ubuntu-latest
    needs: semantic-release
    if: needs.semantic-release.outputs.published == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.semantic-release.outputs.git-tag }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/setup-qemu-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish release image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.semantic-release.outputs.version }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.semantic-release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-chart:
    runs-on: ubuntu-latest
    needs:
      - semantic-release
      - publish-server-image
    if: needs.semantic-release.outputs.published == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.semantic-release.outputs.git-tag }}

      - uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint "$CHART_DIR"

      - name: Package chart
        run: |
          mkdir -p "$CHART_PACKAGE_DIR"
          helm package "$CHART_DIR" \
            --version "${{ needs.semantic-release.outputs.version }}" \
            --app-version "${{ needs.semantic-release.outputs.version }}" \
            --destination "$CHART_PACKAGE_DIR"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Publish chart
        run: helm push "$CHART_PACKAGE_DIR"/*.tgz "$OCI_REGISTRY"
