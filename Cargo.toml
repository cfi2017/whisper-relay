[workspace]
members = [
    "crates/client",
    "crates/protocol",
    "crates/server",
]
resolver = "2"

[workspace.package]
version = "1.9.7"
edition = "2021"
license = "MIT"
repository = "https://github.com/cfi2017/whisper-relay"

[workspace.dependencies]
anyhow = "1.0.98"
chrono = { version = "0.4.41", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5.41", features = ["derive", "env"] }
futures-util = "0.3.31"
reqwest = { version = "0.12.22", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
thiserror = "2.0.12"
tokio = { version = "1.46.1", features = ["macros", "process", "rt-multi-thread", "signal", "sync", "time", "fs", "io-util"] }
tokio-tungstenite = { version = "0.27.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
url = "2.5.4"
uuid = { version = "1.17.0", features = ["serde", "v4"] }
