apiVersion: apps/v1
kind: Deployment
metadata:
  name: swiss-german-asr
  namespace: vllm
  labels:
    app: swiss-german-asr
spec:
  replicas: 1
  progressDeadlineSeconds: 3600
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: swiss-german-asr
  template:
    metadata:
      labels:
        app: swiss-german-asr
    spec:
      terminationGracePeriodSeconds: 60
      nodeSelector:
        kubernetes.io/arch: arm64
      volumes:
        - name: cache-volume
          persistentVolumeClaim:
            claimName: hf-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
      containers:
        - name: swiss-german-asr
          # Pin this in production once you have a known-good vLLM audio build.
          image: vllm/vllm-openai:latest-audio
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - |
              exec vllm serve Flurin17/whisper-large-v3-turbo-swiss-german \
                --served-model-name swiss-german-whisper \
                --task transcription \
                --dtype bfloat16 \
                --gpu-memory-utilization 0.20 \
                --max-model-len 448 \
                --max-num-seqs 8 \
                --host 0.0.0.0 \
                --port 8000
          env:
            - name: HF_HOME
              value: /root/.cache/huggingface
            - name: HF_HUB_CACHE
              value: /root/.cache/huggingface/hub
            - name: TRANSFORMERS_CACHE
              value: /root/.cache/huggingface/hub
            - name: VLLM_MAX_AUDIO_CLIP_FILESIZE_MB
              value: "64"
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: "4"
              memory: 12Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "12"
              memory: 32Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: cache-volume
              mountPath: /root/.cache/huggingface
            - name: shm
              mountPath: /dev/shm
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 400
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: swiss-german-asr
  namespace: vllm
spec:
  selector:
    app: swiss-german-asr
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
  type: ClusterIP
