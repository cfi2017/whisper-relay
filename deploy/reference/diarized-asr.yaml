apiVersion: apps/v1
kind: Deployment
metadata:
  name: diarized-asr
  namespace: vllm
  labels:
    app: diarized-asr
spec:
  replicas: 1
  progressDeadlineSeconds: 3600
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: diarized-asr
  template:
    metadata:
      labels:
        app: diarized-asr
    spec:
      terminationGracePeriodSeconds: 60
      nodeSelector:
        kubernetes.io/arch: arm64
      volumes:
        - name: cache-volume
          persistentVolumeClaim:
            claimName: hf-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
      containers:
        - name: diarized-asr
          # Build an adapter image that exposes /v1/audio/transcriptions and returns
          # OpenAI-style JSON with segments[].speaker. It should run speaker
          # diarization locally and call ASR_BASE_URL for segment transcription.
          image: ghcr.io/your-org/diarized-asr:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: ASR_BASE_URL
              value: http://qwen3-asr.vllm.svc.cluster.local:8000/v1
            - name: ASR_MODEL
              value: qwen3-asr
            - name: DIARIZATION_MODEL
              value: pyannote/speaker-diarization-3.1
            - name: HF_HOME
              value: /root/.cache/huggingface
            - name: HF_HUB_CACHE
              value: /root/.cache/huggingface/hub
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
                  optional: true
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: 24Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: cache-volume
              mountPath: /root/.cache/huggingface
            - name: shm
              mountPath: /dev/shm
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: diarized-asr
  namespace: vllm
spec:
  selector:
    app: diarized-asr
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
  type: ClusterIP
