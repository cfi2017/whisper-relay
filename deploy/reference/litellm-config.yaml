model_list:
  - model_name: whisper
    litellm_params:
      model: openai/qwen3-asr
      api_base: http://qwen3-asr.vllm.svc.cluster.local:8000/v1
      api_key: none
    model_info:
      mode: audio_transcription

  - model_name: whisper-diarized
    litellm_params:
      model: openai/whisper-diarized
      api_base: http://diarized-asr.vllm.svc.cluster.local:8000/v1
      api_key: none
    model_info:
      mode: audio_transcription

  - model_name: whisper-swiss-german
    litellm_params:
      model: openai/jayr23/whisper-large-v3-turbo-swiss-german-ct2
      api_base: http://swiss-german-asr.vllm.svc.cluster.local:8000/v1
      api_key: none
    model_info:
      mode: audio_transcription

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
