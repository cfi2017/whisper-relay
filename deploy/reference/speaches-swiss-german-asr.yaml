apiVersion: apps/v1
kind: Deployment
metadata:
  name: swiss-german-asr
  namespace: vllm
  labels:
    app: swiss-german-asr
spec:
  replicas: 1
  progressDeadlineSeconds: 3600
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: swiss-german-asr
  template:
    metadata:
      labels:
        app: swiss-german-asr
    spec:
      terminationGracePeriodSeconds: 60
      nodeSelector:
        kubernetes.io/arch: arm64
      volumes:
        - name: cache-volume
          persistentVolumeClaim:
            claimName: hf-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
      containers:
        - name: speaches
          # Pin this in production once you have a known-good CUDA build.
          image: ghcr.io/speaches-ai/speaches:latest-cuda
          imagePullPolicy: IfNotPresent
          env:
            - name: UVICORN_HOST
              value: 0.0.0.0
            - name: UVICORN_PORT
              value: "8000"
            - name: HF_HOME
              value: /home/ubuntu/.cache/huggingface
            - name: HF_HUB_CACHE
              value: /home/ubuntu/.cache/huggingface/hub
            - name: STT_MODEL_TTL
              value: "-1"
            - name: PRELOAD_MODELS
              value: '["jayr23/whisper-large-v3-turbo-swiss-german-ct2"]'
            - name: WHISPER__INFERENCE_DEVICE
              value: cuda
            - name: WHISPER__COMPUTE_TYPE
              value: float16
            - name: WHISPER__NUM_WORKERS
              value: "2"
            - name: LOG_LEVEL
              value: info
            - name: ENABLE_UI
              value: "false"
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: "4"
              memory: 12Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "12"
              memory: 32Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: cache-volume
              mountPath: /home/ubuntu/.cache/huggingface
            - name: shm
              mountPath: /dev/shm
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 400
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: swiss-german-asr
  namespace: vllm
spec:
  selector:
    app: swiss-german-asr
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
  type: ClusterIP
