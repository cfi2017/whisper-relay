{{- if and .Values.secrets.create (not .Values.existingSecrets.oidc.name) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "whisper-relay-server.oidcSecretName" . }}
  labels:
    {{- include "whisper-relay-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.existingSecrets.oidc.issuerKey }}: {{ required "secrets.oidc.issuer is required when secrets.create=true and no existing OIDC secret is set" .Values.secrets.oidc.issuer | quote }}
  {{ .Values.existingSecrets.oidc.audienceKey }}: {{ required "secrets.oidc.audience is required when secrets.create=true and no existing OIDC secret is set" .Values.secrets.oidc.audience | quote }}
{{- end }}
{{- if and .Values.secrets.create .Values.secrets.transcription.apiKey (not .Values.config.transcriptionApiKeySecret.name) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "whisper-relay-server.transcriptionSecretName" . }}
  labels:
    {{- include "whisper-relay-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.config.transcriptionApiKeySecret.key }}: {{ .Values.secrets.transcription.apiKey | quote }}
{{- end }}

