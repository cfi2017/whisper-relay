replicaCount: 1

image:
  repository: ghcr.io/cfi2017/whisper-relay-server
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

config:
  bind: "0.0.0.0:8080"
  insecureNoAuth: false
  oidcIssuer: ""
  oidcAudience: ""
  transcriptionBaseUrl: "http://litellm.litellm.svc.cluster.local:4000"
  transcriptionModel: "whisper"
  transcriptionApiKey: ""
  diarizationBaseUrl: ""
  diarizationModel: "whisper-diarized"
  diarizationResponseFormat: "diarized_json"
  diarizationApiKey: ""
  transcriptionApiKeySecret:
    name: ""
    key: api-key
    optional: true
  language: ""
  prompt: ""
  chunkSeconds: 15
  transcriptionTimeoutSeconds: 3600
  maxAudioMiB: 512
  smartChunking: true
  asrConcurrency: 4
  targetChunkSeconds: 25
  maxChunkSeconds: 28
  backendDiarization: false

secrets:
  create: false
  oidc:
    issuer: ""
    audience: ""
  transcription:
    apiKey: ""

existingSecrets:
  oidc:
    name: ""
    issuerKey: issuer
    audienceKey: audience

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}

probes:
  liveness:
    enabled: true
  readiness:
    enabled: true

gateway:
  enabled: false
  apiVersion: gateway.networking.k8s.io/v1
  parentRefs:
    - name: gateway
      namespace: default
      sectionName: https
  hostnames: []
  pathPrefix: /
  annotations: {}
  labels: {}
